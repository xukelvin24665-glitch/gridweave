name: Verify GridWeave
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m gridweave demo --frontier --output output/demo.json
      - run: python -m gridweave validate output/demo.json
      - run: python -m gridweave benchmark --seeds 3 --output-dir output/smoke
      - uses: actions/upload-artifact@v4
        with:
          name: experiments-python-${{ matrix.python }}
          path: output/
